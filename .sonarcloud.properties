# SonarCloud Automatic Analysis Configuration
sonar.sources=src,database
sonar.tests=tests
sonar.exclusions=docs/**/*,report/**/*,labs/**/*,scratch/**/*,coverage/**/*

# Canonical 28-table DDL snapshot intentionally mirrors database/migrations/*.sql (security/bug rules still apply)
sonar.cpd.exclusions=database/mssql_schema.sql,**/mssql_schema.sql
