name: VAMOS STORE CI

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'YourStrongPassword123!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Pug template compilation
        run: node tests/validate_pug.js

      - name: Build Tailwind CSS
        run: npx tailwindcss -i ./src/public/css/input.css -o ./src/public/css/style.css --minify

      - name: Run Validator Unit Tests
        run: node tests/validator.test.js

      - name: Bootstrap Test Database & Seed Fixtures
        env:
          NODE_ENV: test
          DB_SERVER: 127.0.0.1
          DB_PORT: 1433
          DB_USER: sa
          DB_PASSWORD: 'YourStrongPassword123!'
          DB_TEST_NAME: vamos_store_test_db
          SESSION_SECRET: 'ci_test_session_secret_vamos_store_2026_random_key'
          DB_ENCRYPT: 'false'
          DB_TRUST_SERVER_CERTIFICATE: 'true'
        run: node tests/setup_test_db.js

      - name: Run Auth Flow & Session Verification Tests
        env:
          NODE_ENV: test
          DB_SERVER: 127.0.0.1
          DB_PORT: 1433
          DB_USER: sa
          DB_PASSWORD: 'YourStrongPassword123!'
          DB_TEST_NAME: vamos_store_test_db
          SESSION_SECRET: 'ci_test_session_secret_vamos_store_2026_random_key'
          DB_ENCRYPT: 'false'
          DB_TRUST_SERVER_CERTIFICATE: 'true'
        run: node tests/test_auth_flow.js

      - name: Run Real-time Live Search & Security API Tests
        env:
          NODE_ENV: test
          DB_SERVER: 127.0.0.1
          DB_PORT: 1433
          DB_USER: sa
          DB_PASSWORD: 'YourStrongPassword123!'
          DB_TEST_NAME: vamos_store_test_db
          SESSION_SECRET: 'ci_test_session_secret_vamos_store_2026_random_key'
          DB_ENCRYPT: 'false'
          DB_TRUST_SERVER_CERTIFICATE: 'true'
        run: node tests/test_live_search.js

      - name: Run Full Regression & Integration Test Suite
        env:
          NODE_ENV: test
          DB_SERVER: 127.0.0.1
          DB_PORT: 1433
          DB_USER: sa
          DB_PASSWORD: 'YourStrongPassword123!'
          DB_TEST_NAME: vamos_store_test_db
          SESSION_SECRET: 'ci_test_session_secret_vamos_store_2026_random_key'
          DB_ENCRYPT: 'false'
          DB_TRUST_SERVER_CERTIFICATE: 'true'
        run: npm test

