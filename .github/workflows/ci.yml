name: VAMOS STORE CI

on:
  push:
    branches: [ main, 'fix/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [ '22.x', '24.x' ]

    env:
      NODE_ENV: test
      DB_SERVER: 127.0.0.1
      DB_PORT: 1433
      DB_USER: sa
      DB_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD }}
      DB_TEST_NAME: vamos_store_test_db
      ADMIN_DEFAULT_PASSWORD: ${{ secrets.ADMIN_DEFAULT_PASSWORD }}
      SESSION_SECRET: ${{ secrets.CI_SESSION_SECRET }}
      DB_ENCRYPT: 'false'
      DB_TRUST_SERVER_CERTIFICATE: 'true'

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium browser
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Verify Pug template compilation
        run: node tests/validate_pug.js

      - name: Validate Docker Compose configuration
        env:
          SESSION_SECRET: ci_validation_placeholder_secret_32chars_min
          DB_PASSWORD: CiValidationPlaceholder!123
        run: docker compose --profile loyalty-worker config --quiet

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Run Validator Unit Tests
        run: node tests/test_validator.js

      - name: Bootstrap Test Database & Seed Fixtures
        run: node tests/setup_test_db.js

      - name: Run Auth Flow & Session Verification Tests
        run: node tests/test_auth_flow.js

      - name: Run Real-time Live Search & Security API Tests
        run: node tests/test_live_search.js

      - name: Run Full Regression & Integration Test Suite
        run: node tests/regression_suite.js

      - name: Run Complete Test Suite Unified Check (npm run test:all)
        run: npm run test:all

