sonar.projectKey=dungtttd01702-coder_vamos-store
sonar.organization=dungtttd01702-coder

# Encoding
sonar.sourceEncoding=UTF-8

# Source folders to inspect for application quality and security
sonar.sources=src,database

# Test folders
sonar.tests=tests

# Exclude non-production mockups, static HTML archives, documentation and lab exports
sonar.exclusions=docs/**/*,report/**/*,labs/**/*,scratch/**/*,coverage/**/*

# Exclude canonical 28-table DDL snapshot from duplicate-block CPD against database/migrations/*.sql (security/bug rules still apply)
sonar.cpd.exclusions=database/mssql_schema.sql
