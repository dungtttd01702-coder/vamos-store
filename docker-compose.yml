# Docker Compose configuration for VAMOS STORE
# System Architecture: Node.js (Express + Pug) with Microsoft SQL Server
version: '3.8'

services:
  app:
    build: .
    container_name: vamos_store_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - APP_NAME=VAMOS STORE
      - APP_URL=http://localhost:3000
      - SESSION_SECRET=vamos_docker_session_secret_2026_xyz
      - DB_TYPE=mssql
      - DB_SERVER=mssql
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=VamosPassSecure2025!
      - DB_NAME=vamos_store_db
      - DB_TRUST_SERVER_CERTIFICATE=true
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./server.js:/app/server.js

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vamos_store_mssql
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=VamosPassSecure2025!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'VamosPassSecure2025!' -C -Q 'SELECT 1' 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'VamosPassSecure2025!' -Q 'SELECT 1' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mssql_data:
    driver: local
